<style>
  :root{
    --bg:#0a0b0f; --bg2:#12131a; --ink:#e7e9ee; --dim:#9aa3b2; --line:#232634;
    --crimson:#e5484d; --gold:#e8c36a; --green:#00ff88; --violet:#8d83ff;
    --mono:"JetBrains Mono",ui-monospace,monospace; --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(60vw 44vw at 78% -6%,rgba(229,72,77,.16),transparent 58%),
      radial-gradient(44vw 34vw at 4% 88%,rgba(0,255,136,.05),transparent 52%),
      linear-gradient(168deg,#0b070a,#0f1016 52%,var(--bg));
    color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--crimson);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:22px 0;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px}
  .mark{width:30px;height:30px;border-radius:7px;background:
    conic-gradient(from 210deg,var(--crimson),#7a1f26 55%,var(--crimson));
    box-shadow:0 0 22px #e5484d66;position:relative;overflow:hidden}
  .mark::after{content:"";position:absolute;inset:0;background:
    linear-gradient(115deg,transparent 46%,#0a0b0f 47%,#0a0b0f 53%,transparent 54%)}
  .langs{display:flex;gap:2px;font-family:var(--mono);font-size:12px}
  .langs button{background:none;border:1px solid var(--line);color:var(--dim);padding:5px 8px;
    border-radius:6px;cursor:pointer;transition:.15s}
  .langs button.active,.langs button:hover{color:#000;background:var(--crimson);border-color:var(--crimson);font-weight:700}

  /* ── hero ───────────────────────────────────────────────────────────────── */
  .hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(400px,1.08fr);
    gap:clamp(18px,3.4vw,40px);align-items:center;padding:44px 0 40px;min-height:560px}
  .kicker{font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
    color:var(--crimson);margin:0 0 14px}
  .hero h1{font-size:clamp(38px,6vw,64px);margin:0 0 6px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  .hero .glyph{color:var(--crimson);font-size:.5em;letter-spacing:0;margin-left:.35em;vertical-align:middle}
  .tag{color:var(--dim);font-size:clamp(15px,1.5vw,18px);max-width:34rem;margin:14px 0 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;font-family:var(--mono);font-size:12px}
  .chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--dim)}
  .chip b{color:var(--ink)}
  .chip.warn{border-color:#e5484d55;color:#ff9ba0}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .btn{font-family:var(--mono);font-size:13px;border:1px solid var(--crimson);color:var(--crimson);
    padding:10px 16px;border-radius:8px;transition:.15s}
  .btn:hover{background:var(--crimson);color:#000}
  .btn.ghost{border-color:var(--line);color:var(--dim)}
  .btn.ghost:hover{background:var(--line);color:var(--ink)}

  .stage{position:relative;height:560px;min-width:0;isolation:isolate;cursor:grab;touch-action:pan-y}
  .stage:active{cursor:grabbing}
  .stage::after{content:"";position:absolute;inset:14%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle,rgba(229,72,77,.18),rgba(0,255,136,.04) 44%,transparent 70%);
    filter:blur(26px)}
  #fork{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
  .scene-label{position:absolute;z-index:2;padding:7px 10px;border:1px solid #e5484d33;
    border-radius:7px;background:rgba(10,11,15,.62);backdrop-filter:blur(8px);
    font:500 9px/1.4 var(--mono);letter-spacing:.11em;color:var(--dim);pointer-events:none}
  .scene-label b{display:block;font-size:11px;letter-spacing:.14em;margin-bottom:2px;color:var(--ink)}
  .scene-label.live{left:0;bottom:16%;border-color:#3c465a}
  .scene-label.live b{color:#aab4c6}
  .scene-label.fork{right:1%;top:12%}
  .scene-label.fork b{color:var(--crimson)}
  .verdict{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:2;text-align:center;
    pointer-events:none;white-space:nowrap}
  .verdict b{display:block;font:700 15px/1 var(--mono);letter-spacing:.2em;color:var(--green);
    transition:color .25s}
  .verdict b[data-tone="bad"]{color:var(--crimson)}
  .verdict span{display:block;margin-top:5px;font:500 10px/1.3 var(--mono);color:var(--dim)}
  .hint{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);z-index:2;
    font:500 9px/1 var(--mono);letter-spacing:.16em;color:rgba(154,163,178,.45);
    text-transform:uppercase;white-space:nowrap;pointer-events:none}

  /* ── sections ───────────────────────────────────────────────────────────── */
  section{padding:44px 0;border-top:1px solid var(--line)}
  h2{font-size:26px;margin:0 0 6px}
  .lead{color:var(--dim);margin:0 0 22px;max-width:62rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--bg2),#0d0e14);border:1px solid var(--line);
    border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:border-color .2s}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--line);transition:.2s}
  .card:hover{border-color:#e5484d33}
  .card:hover::before{background:var(--crimson)}
  .card h3{margin:0 0 6px;font-family:var(--mono);font-size:14px}
  .card p{margin:0;color:var(--dim);font-size:14px}
  .k{color:var(--gold)}
  .held{color:var(--green)}
  .cycle{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px}
  .step{flex:1 1 150px;background:#0d0e14;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;position:relative}
  .step i{display:block;font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--crimson);margin-bottom:6px}
  .step span{color:var(--dim)}
  .step.ok i{color:var(--green)}
  .safety{background:#e5484d0d;border:1px solid #e5484d33;border-radius:14px;padding:22px}
  .safety h2{color:var(--crimson)}
  .safety .lead{color:#ffb3b6;margin:0}
  footer{padding:34px 0 60px;color:var(--dim);font-size:13px;text-align:center;border-top:1px solid var(--line)}
  footer a{color:var(--dim)}
  .siblings{font-family:var(--mono);font-size:12px;color:#7f8b9e;max-width:56rem;margin:0 auto 18px}
  .siblings a{color:var(--ink);border-bottom:1px solid var(--line)}
  .siblings a:hover{border-color:var(--crimson)}

  @media(max-width:900px){
    .hero{grid-template-columns:1fr;min-height:0;padding-top:26px}
    .stage{height:min(480px,74vw);min-height:340px;order:-1;margin-bottom:-4px}
    .scene-label{display:none}
    /* Narration wraps rather than overflowing: the longest strings are RU and FR. */
    .verdict{white-space:normal;max-width:88vw}
  }
  @media(max-width:600px){
    .stage{height:380px;margin:0 -8px 10px}
  }
  @media(prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>

const SCENE_KEYS = ["fork","forkDetail","held","heldDetail","exploited","exploitedDetail",
                    "fix","fixDetail","refused","refusedDetail","gone","goneDetail"];

let scene = null;

function words(dict){
  const out = {};
  SCENE_KEYS.forEach(k => { const v = dict["w_" + k]; if (v != null) out[k] = v; });
  return out;
}

function apply(lang){
  const d = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (d[k] != null) el.innerHTML = d[k];
  });
  document.querySelectorAll("#langs button")
    .forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  // The module script mounts after this classic script runs, so the vocabulary is also parked
  // on window for the initial mount — otherwise the first pass would narrate in English.
  window.__dolosWords = words(d);
  if (scene) scene.setWords(window.__dolosWords);
  try { localStorage.setItem("dolos_lang", lang); } catch (e) {}
}

document.getElementById("langs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) apply(b.dataset.lang);
});

let initial = "en";
try { const s = localStorage.getItem("dolos_lang"); if (s && I18N[s]) initial = s; } catch (e) {}
if (initial === "en") { const n = (navigator.language || "").slice(0, 2); if (I18N[n]) initial = n; }
window.__dolosLang = initial;
apply(initial);
</script>

<script type="module">
import { mountForkScene } from "./fork.js";

// The scene narrates itself through the HUD, so it needs the current language's vocabulary.
try {
  scene = mountForkScene(document.getElementById("fork"), {
    hud: {
      verdict: document.getElementById("verdictWord"),
      detail: document.getElementById("verdictDetail"),
    },
    words: (window.__dolosWords || {}),
  });
  window.dispatchEvent(new Event("dolos:scene-ready"));
} catch (err) {
  console.warn("[dolos-fork]", err);
  document.getElementById("stage")?.classList.add("failed");
}
</script>
