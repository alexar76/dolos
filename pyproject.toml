[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimarket-dolos"
version = "0.1.0"
description = "DOLOS — dynamic EVM attack harness for the UNI bubble (fork-isolated, fix-loop capable)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["web3>=6", "eth-account>=0.11"]

[project.optional-dependencies]
# oracle-core gives the ecosystem's canonical Ed25519 Signer; without it DOLOS uses a
# cryptography-backed local signer with the same public API.
signing = ["cryptography>=41"]
dev = ["pytest>=8", "pytest-cov>=5", "cryptography>=41", "ruff>=0.12,<1"]

[project.urls]
Documentation = "https://github.com/alexar76/dolos#readme"
Issues = "https://github.com/alexar76/dolos/issues"
Repository = "https://github.com/alexar76/dolos"

[project.scripts]
dolos = "dolos.__main__:main"

[tool.setuptools]
packages = ["dolos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is on the path too: the suite imports its fakes from conftest by name.
pythonpath = [".", "tests"]
addopts = "--cov=dolos --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["dolos"]

[tool.coverage.report]
# The floor is set below the ~96% a machine WITH Foundry reaches, because the integration tests
# in test_smoke.py self-skip where anvil/forge are absent and take ForkChain's process plumbing
# with them (~92% without the toolchain). Both configurations must pass.
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
